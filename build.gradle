plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.aphs'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Keep JavaFX on the Java 21 line; the plugin selects this machine's native artifacts.
javafx {
    version = '21.0.11'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

def fxglVersion = '21.1'
def gdxVersion = '1.14.2'

dependencies {
    // Both frameworks are available. No game loop or frontend is chosen here.
    implementation("com.github.almasb:fxgl:$fxglVersion") {
        // JavaFX plugin owns versions/classifiers; avoid mixed Intel/ARM native jars.
        exclude group: 'org.openjfx'
    }
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.aphs.classroomuprising.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
