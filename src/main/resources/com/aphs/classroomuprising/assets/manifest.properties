# Classroom Uprising art manifest. See docs/art-asset-spec.md.
# Code uses only the keys on the left. Paths are relative to this folder.
# A listed file that does not exist yet is shown in the game as a labelled "missing art" plate.

# ---- Backgrounds: background.<place> = file ; optional background.<place>.<time of day> overrides it ----
background.title = backgrounds/title.png
background.opening = backgrounds/opening-exam-hall.png
# The ICS4U class meets in the computer lab: one photo serves both places.
background.classroom = backgrounds/computer-lab.jpg
background.hallway = backgrounds/hallway.jpg
background.hub = backgrounds/student-hub.jpg
# One photo for every Hub period: the time-of-day grade turns it to evening. A dedicated evening photo can be
# listed again as background.hub.evening = backgrounds/student-hub-evening.jpg once it exists.
background.dorm = backgrounds/dorm-room.png
background.dorm.late_night = backgrounds/dorm-room-night.png
background.computer-lab = backgrounds/computer-lab.jpg

# Optional transparent layer drawn in front of characters (e.g. desks), with more parallax.
foreground.classroom = backgrounds/classroom-desks.png

# ---- Characters: same canvas size for every expression of one character ----
character.reward.name = Mr. Reward
# All expressions share one 1217x837 canvas: head width and face position are the same in each,
# so switching expression never moves him. The photos face right; on the right of the screen he is mirrored.
character.reward.height = 669
character.reward.anchor = 0.3202, 1.0
character.reward.faces = right
character.reward.expression.neutral = characters/reward/neutral.png
character.reward.expression.speechless = characters/reward/neutral.png
character.reward.expression.smile = characters/reward/smile.png
character.reward.expression.stern = characters/reward/stern.png
character.reward.expression.tough = characters/reward/stern.png
character.reward.expression.gotcha = characters/reward/gotcha.png
character.reward.expression.ridicule = characters/reward/ridicule.png
character.reward.expression.staring = characters/reward/staring.png
character.reward.expression.thumbs-up = characters/reward/thumbs-up.png

character.student.name = You
character.student.height = 600
character.student.anchor = 0.5, 1.0
character.student.expression.neutral = characters/student/neutral.png
character.student.expression.worried = characters/student/worried.png

# ---- Optional interface artwork (code draws a fallback until delivered) ----
# Square PNGs of the same size; hands drawn pointing to 12 o'clock and rotating about the image centre.
ui.clock-face = ui/clock-face.png
ui.clock-hour-hand = ui/clock-hour-hand.png
ui.clock-minute-hand = ui/clock-minute-hand.png
# The hand-drawn Mr. Reward title card, shown when he first appears in the opening.
ui.reward-logo = ui/reward-logo.png

# ---- Tileable textures for the ambient layer ----
texture.grain = textures/grain.png
texture.motes = textures/motes.png

# ---- Colour grades: #tint, blend mode, tint opacity, saturation, brightness ----
# Blend modes: MULTIPLY, SCREEN, OVERLAY, SOFT_LIGHT, ADD, COLOR_BURN, COLOR_DODGE ...
grade.title = #0B0F2A, MULTIPLY, 0.35, -0.20, -0.10
grade.opening = #FF4D6D, MULTIPLY, 0.30, -0.50, -0.20
grade.morning_bonus = #FFE7C2, SOFT_LIGHT, 0.35, 0.05, 0.05
grade.ics_class = #FFF4DE, SOFT_LIGHT, 0.20, 0.00, 0.00
grade.other_classes = #FFF4DE, SOFT_LIGHT, 0.15, -0.05, 0.00
grade.after_school = #FF9B54, OVERLAY, 0.32, 0.05, -0.02
grade.evening = #3B4FB8, MULTIPLY, 0.45, -0.25, -0.10
grade.late_night = #1A2266, MULTIPLY, 0.65, -0.45, -0.25
grade.day_end = #141A3D, MULTIPLY, 0.60, -0.40, -0.25
grade.combat = #1A2266, MULTIPLY, 0.55, -0.40, -0.18

# ---- Lecture slides: slide.<name> = file ----
# A lecture line that starts with [slide:<name>] turns the projector to that slide; it stays up
# until the next cue. 16:9 images, 1600x900 or larger. See docs/art-asset-spec.md.
# Grade 11 review (Days 1-2): the useful pages of the class deck "Review Overview" (page number first).
slide.review-purpose = slides/gr11-review/02-review-purpose.png
slide.file-structure = slides/gr11-review/07-file-structure.png
slide.example-java = slides/gr11-review/08-example-java.png
slide.data-types = slides/gr11-review/09-data-types.png
slide.variables = slides/gr11-review/10-variables.png
slide.math-and-symbols = slides/gr11-review/11-math-and-symbols.png
slide.decisions = slides/gr11-review/12-decisions.png
slide.loops = slides/gr11-review/13-loops.png
slide.methods = slides/gr11-review/14-methods.png
slide.method-example = slides/gr11-review/15-method-example.png
slide.the-rest = slides/gr11-review/16-the-rest.png
slide.automated-testing = slides/gr11-review/18-automated-testing.png

# ---- Music: bgm.<cue> = file (loops; .mp3, .m4a, .wav or .aiff) ----
# Each screen names its cue; the same cue carries on across screens without restarting.
bgm.title = audio/bgm/title.mp3
bgm.opening = audio/bgm/opening.mp3
bgm.school = audio/bgm/school-day.mp3
bgm.after-school = audio/bgm/after-school.mp3
bgm.night = audio/bgm/night.mp3
bgm.combat = audio/bgm/combat.mp3

# ---- Interface sounds: sfx.<name> = file (short .wav) ----
# The bundled files are simple synthesized placeholders; replace them with the same names.
sfx.cursor = audio/sfx/cursor.wav
sfx.confirm = audio/sfx/confirm.wav
sfx.menu-open = audio/sfx/menu-open.wav
sfx.menu-close = audio/sfx/menu-close.wav
sfx.dialogue = audio/sfx/dialogue.wav
sfx.slide = audio/sfx/slide.wav
sfx.tip = audio/sfx/tip.wav
sfx.transition = audio/sfx/transition.wav
sfx.clock = audio/sfx/clock.wav
sfx.cutin = audio/sfx/cutin.wav
sfx.hit = audio/sfx/hit.wav
sfx.shatter = audio/sfx/shatter.wav
