lesson.1.text=Mr. Reward: Welcome back. Before we build anything new, let us review Grade 11 Java: values, expressions, and decisions. A program does exactly what its statements say, not what we hoped they meant.\nMr. Reward: A variable has a type and a current value. int tickets = 7; stores a whole number. double price = 2.5; stores a floating-point number that can have a fractional part.\nMr. Reward: String name = "Ada"; stores text, while boolean hasPass = true; stores a truth value. Choose a type that matches the information, rather than treating everything as text.\nMr. Reward: The equals sign assigns a value. tickets = tickets + 1; reads the old value, adds one, and stores the result. If tickets was seven, it is now eight.\nMr. Reward: Consider a fresh example: int wholeShare = 7 / 2; gives three. With two int operands, division discards the fractional part; it does not round to the nearest whole number.\nMr. Reward: Changing only the destination does not fix that: double decimalShare = 7 / 2; stores 3.0. The integer division happens before its result is converted to double.\nMr. Reward: Use a floating-point operand when you need the fraction: double properShare = 7 / 2.0; gives 3.5. Check the operands, not just the variable receiving the answer.\nMr. Reward: Operator order matters too. The expression 2 + 3 * 4 gives fourteen, but (2 + 3) * 4 gives twenty. Parentheses make the intended calculation explicit.\nMr. Reward: Conditions produce boolean values. With int age = 16; and hasPass still true, age >= 16 && hasPass is true because both conditions hold. The && operator requires both sides to be true.\nMr. Reward: The code if (age >= 16 && hasPass) { System.out.print("Enter"); } else { System.out.print("Wait"); } prints Enter for those values. If the condition is false, only the else branch runs.\nMr. Reward: Do not confuse assignment with comparison: = changes a variable, while == compares primitive values. For String contents, use .equals, as in "Ada".equals(name), which is true here.\nMr. Reward: System.out.println(name); displays Ada and ends the output line. Printing displays a value; it does not change the value stored in name.\nMr. Reward: When a result surprises you, trace the current values, evaluate the expression, and then follow the selected branch. That is more useful than changing random lines until the output looks right.
