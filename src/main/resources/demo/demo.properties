lesson.2.options=d2-array-index,d2-skip-practice,d2-dismiss-tests,quiet
lesson.2.option.d2-array-index.label=Why is values[values.length] out of bounds for the array you showed?
lesson.2.option.d2-array-index.outcome=APPROPRIATE
lesson.2.option.d2-array-index.effect=0,-2,4,2,0,0,0,0,0
lesson.2.option.d2-array-index.feedback=Good question. A three-element array has indices 0, 1 and 2; its length is 3.
