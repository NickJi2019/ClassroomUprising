lesson.2.text=Mr. Reward: Yesterday we traced values and decisions. Today we will review Grade 11 repetition, arrays, and methods. The same habit applies: explain what changes after each statement.\nMr. Reward: A for loop has initialization, a condition, and an update. In for (int i = 0; i < 3; i++), the body runs with i equal to zero, one, and two. It stops when i becomes three.\nMr. Reward: For example, for (int i = 0; i < 3; i++) { System.out.print(i); } writes 012. The condition is checked before each iteration, so three is never printed.\nMr. Reward: An accumulator keeps a running result. int total = 0; starts the total, and for (int n = 1; n <= 3; n++) { total += n; } changes it to one, then three, then six.\nMr. Reward: A while loop repeats while its condition is true. int remaining = 3; followed by while (remaining > 0) { remaining--; } finishes with zero. Each iteration makes progress toward stopping.\nMr. Reward: If the body never changes what keeps a while condition true, the loop may never stop. Trace the condition and the update together, especially when the loop should run zero times.\nMr. Reward: An array stores indexed elements of one type. int[] values = {4, 7, 2}; creates three int elements. Their indices are zero, one, and two; values[1] is seven.\nMr. Reward: values.length is three, but the last valid index is values.length - 1. Accessing values[values.length] goes past the end and throws an ArrayIndexOutOfBoundsException.\nMr. Reward: To add the elements, start with int sum = 0; then use for (int i = 0; i < values.length; i++) { sum += values[i]; }. The total is thirteen; the strict < keeps every index valid.\nMr. Reward: A method gives a reusable operation a name. Parameters accept input, and return sends a result back to the caller. Keep each method focused on one clear task.\nMr. Reward: Here is a small method: static int doubleValue(int value) { return value * 2; }. Its parameter is value, its return type is int, and doubleValue(4) returns eight.\nMr. Reward: The statement int doubled = doubleValue(4); stores that result. System.out.println(doubled); displays eight. Returning a value and printing a value are different operations.\nMr. Reward: Test a normal case and a boundary case: a loop that runs zero times, an array with one element, or a method called with zero. Explain the expected result before running the code.\nMr. Reward: Loops control repetition, arrays organize values, and methods organize operations. Keep those responsibilities clear; they will make our work with classes much easier to follow.
