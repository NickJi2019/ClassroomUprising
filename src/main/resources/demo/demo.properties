lesson.3.text=Mr. Reward: Chapter 10 introduces classes, objects and encapsulation.\nMr. Reward: Private fields keep state changes behind controlled methods.\nMr. Reward: You may ask about encapsulation, or remain quiet.
lesson.3.title=Classes and Encapsulation
lesson.3.interaction=ASK_TEACHER
lesson.3.prompt=Which question will you ask about encapsulation?
lesson.3.options=d3-private-fields,d3-ignore-access,d3-no-classes,quiet
lesson.3.option.d3-private-fields.label=How do private fields and public methods help control changes to an object?
lesson.3.option.d3-private-fields.outcome=APPROPRIATE
lesson.3.option.d3-private-fields.effect=0,-2,8,4,0,0,0,0,0
lesson.3.option.d3-private-fields.feedback=Methods can check changes before updating the private fields.
lesson.3.option.d3-ignore-access.label=Can I ignore access modifiers because they are only decoration?
lesson.3.option.d3-ignore-access.outcome=INAPPROPRIATE
lesson.3.option.d3-ignore-access.effect=0,-2,0,0,0,0,0,0,0
lesson.3.option.d3-ignore-access.feedback=Access modifiers affect which code can reach a member; they are not decoration.
lesson.3.option.d3-no-classes.label=Can we leave classes out of this lesson about classes?
lesson.3.option.d3-no-classes.outcome=INAPPROPRIATE
lesson.3.option.d3-no-classes.effect=0,-2,0,0,0,0,0,0,0
lesson.3.option.d3-no-classes.feedback=Classes are the subject of this lesson. Ask about the part that you are trying to understand.
lesson.3.option.quiet.label=Stay quiet
lesson.3.option.quiet.outcome=SKIP
lesson.3.option.quiet.effect=0,0,0,0,0,0,0,0,0
lesson.3.option.quiet.feedback=You listen quietly and finish the class.
lesson.4.text=Mr. Reward: A constructor initializes a newly created object.\nMr. Reward: Overloaded constructors use different parameter lists.\nMr. Reward: You may ask about constructors, or remain quiet.
lesson.4.title=Constructors
lesson.4.interaction=ASK_TEACHER
lesson.4.prompt=Which question will you ask about constructors?
lesson.4.options=d4-parameters,d4-return-type,d4-skip-initialization,quiet
lesson.4.option.d4-parameters.label=How does Java choose between constructors with different parameter lists?
lesson.4.option.d4-parameters.outcome=APPROPRIATE
lesson.4.option.d4-parameters.effect=0,-2,8,4,0,0,0,0,0
lesson.4.option.d4-parameters.feedback=The supplied arguments must match an applicable constructor parameter list.
lesson.4.option.d4-return-type.label=Can I overload constructors by changing only their return type?
lesson.4.option.d4-return-type.outcome=INAPPROPRIATE
lesson.4.option.d4-return-type.effect=0,-2,0,0,0,0,0,0,0
lesson.4.option.d4-return-type.feedback=Constructors have no return type. Overloads need different parameter lists.
lesson.4.option.d4-skip-initialization.label=Can I ignore initialization and assume every object starts exactly as I want?
lesson.4.option.d4-skip-initialization.outcome=INAPPROPRIATE
lesson.4.option.d4-skip-initialization.effect=0,-2,0,0,0,0,0,0,0
lesson.4.option.d4-skip-initialization.feedback=You need to establish the object state deliberately; assumptions are not initialization.
lesson.4.option.quiet.label=Stay quiet
lesson.4.option.quiet.outcome=SKIP
lesson.4.option.quiet.effect=0,0,0,0,0,0,0,0,0
lesson.4.option.quiet.feedback=You listen quietly and finish the class.

