question.csa2015-q38.pages=49
question.csa2015-q38.keyPage=79
question.csa2015-q38.reason=Compare three reverse-subrange algorithms, including an overlapping midpoint loop and odd/even lengths.
question.csa2015-q38.prompt=The method should concatenate words from startIndex through the last element in reverse order. For {"Bear", "Apple", "Gorilla", "House", "Car"} and startIndex=2, it returns "CarHouseGorilla". Which proposed segments can replace /* missing code */ so concatWords works as intended?
question.csa2015-q38.code=/** Precondition: words.length > 0; startIndex >= 0 */\npublic static String concatWords(String[] words, int startIndex) {\n    String result = "";\n    /* missing code */\n    return result;\n}\n// I\nfor (int k = startIndex; k < words.length; k++) {\n    result += words[k] + words[words.length - k - 1];\n}\n// II\nint k = words.length - 1;\nwhile (k >= startIndex) {\n    result += words[k];\n    k--;\n}\n// III\nString[] temp = new String[words.length];\nfor (int k = 0; k <= words.length / 2; k++) {\n    temp[k] = words[words.length - k - 1];\n    temp[words.length - k - 1] = words[k];\n}\nfor (int k = 0; k < temp.length - startIndex; k++) {\n    result += temp[k];\n}
question.csa2015-q38.answer=E
question.csa2015-q38.explanation=II walks backward to startIndex. III builds a reversed copy and takes its first length-startIndex elements; repeated midpoint assignments are harmless. I concatenates extra pairs.
question.csa2015-q38.option.A=I only
question.csa2015-q38.option.B=II only
question.csa2015-q38.option.C=III only
question.csa2015-q38.option.D=I and II
question.csa2015-q38.option.E=II and III
