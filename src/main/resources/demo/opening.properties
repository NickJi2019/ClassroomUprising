question.csa2014-q40.reason=Trace recursive calls and output during stack unwinding, not entry order.
question.csa2014-q40.prompt=What is printed as a result of the call whatsItDo("WATCH")?
question.csa2014-q40.code=public static void whatsItDo(String str) {\n    int len = str.length();\n    if (len > 1) {\n        String temp = str.substring(0, len - 1);\n        whatsItDo(temp);\n        System.out.println(temp);\n    }\n}
question.csa2014-q40.answer=C
question.csa2014-q40.explanation=Printing occurs after the recursive call. The one-character base case prints nothing; the callers then print W, WA, WAT, WATC.
question.csa2014-q40.option.A=WATC\nWAT\nWA\nW
question.csa2014-q40.option.B=WATCH\nWATC\nWAT\nWA
question.csa2014-q40.option.C=W\nWA\nWAT\nWATC
question.csa2014-q40.option.D=W\nWA\nWAT\nWATC\nWATCH
question.csa2014-q40.option.E=WATCH\nWATC\nWAT\nWA\nW\nWA\nWAT\nWATC\nWATCH
