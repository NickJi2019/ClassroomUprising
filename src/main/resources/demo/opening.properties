question.csa2014-q39.prompt=What value is returned as a result of the call recur(27)?
question.csa2014-q39.code=public int recur(int n) {\n    if (n <= 10) { return n * 2; }\n    else { return recur(recur(n / 3)); }\n}
question.csa2014-q39.answer=D
question.csa2014-q39.explanation=recur(27) becomes recur(18), then recur(12), then recur(8), which returns 16. The inner calls return 18, 12 and 8 respectively.
