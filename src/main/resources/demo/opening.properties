story.intro=You: In Grade 11, I took ICS4U. This was the final exam, before summer school.\nYou: I could barely focus. Every page looked harder than the last.\nMr. Reward: Ten questions. Show me what you learned this semester.\nYou: Ms Tang's rubber duck was still in my bag. Just one. I needed to make it count.
story.defeat=You: Final grade: 67.\nMr. Reward: Go home little guy. You are not the one for Computer Science. WOHAHAHAHA!\nYou: His voice kept repeating whenever I looked at my marks. I couldn't accept this result.\nYou: I signed up for summer school. This time, I would be ready to face him.\nYou: Day 1. The retake starts here.
story.victory=Mr. Reward: You answered all ten? Even those last questions? I... did not expect that.\nYou: Final grade: 89.\nYou: I had beaten the exam, but the number still wasn't good enough for me.\nYou: I signed up for summer school. Not to erase a defeat this time, but to aim higher.\nYou: Day 1. The retake starts here.
question.csa2014-q15.source=2014 AP Computer Science A Practice Exam
question.csa2014-q15.number=15
question.csa2014-q15.pages=18
question.csa2014-q15.keyPage=60
question.csa2014-q15.reason=Compare three implementations: loop bounds, premature return, and a counterexample.
question.csa2014-q15.prompt=The following method is intended to return true if the elements in data appear in sorted (ascending) order and false otherwise. Which proposed replacements for /* missing code */ make isSorted work as intended?
question.csa2014-q15.code=public static boolean isSorted(int[] data) {\n    /* missing code */\n}\n// I\nfor (int k = 1; k < data.length; k++) {\n    if (data[k - 1] > data[k]) { return false; }\n}\nreturn true;\n// II\nfor (int k = 0; k < data.length; k++) {\n    if (data[k] > data[k + 1]) { return false; }\n}\nreturn true;\n// III\nfor (int k = 0; k < data.length - 1; k++) {\n    if (data[k] > data[k + 1]) { return false; }\n    else { return true; }\n}\nreturn true;
question.csa2014-q15.answer=A
question.csa2014-q15.explanation=I checks every adjacent pair. II can access data[data.length]. III returns after the first comparison, missing a later inversion such as {1, 2, 0}.
question.csa2014-q15.option.A=I only
question.csa2014-q15.option.B=II only
question.csa2014-q15.option.C=III only
question.csa2014-q15.option.D=I and II only
question.csa2014-q15.option.E=I and III only
question.csa2014-q22.source=2014 AP Computer Science A Practice Exam
question.csa2014-q22.number=22
question.csa2014-q22.pages=25–26
question.csa2014-q22.keyPage=60
question.csa2014-q22.reason=Separate declared-type method lookup from runtime overriding; the shared class definitions are required.
question.csa2014-q22.prompt=Consider the Book and AudioBook classes and the code segment in another class. The code does not compile. Which explanation is correct?
question.csa2014-q22.code=public class Book {\n    private int numPages;\n    private String bookTitle;\n    public Book(int pages, String title) {\n        numPages = pages;\n        bookTitle = title;\n    }\n    public String toString() { return bookTitle + " " + numPages; }\n    public int length() { return numPages; }\n}\npublic class AudioBook extends Book {\n    private int numMinutes;\n    public AudioBook(int minutes, int pages, String title) {\n        super(pages, title);\n        numMinutes = minutes;\n    }\n    public int length() { return numMinutes; }\n    public double pagesPerMinute() { return ((double) super.length()) / numMinutes; }\n}\n// Segment in another class\nBook[] books = new Book[2];                                      // Line 1\nbooks[0] = new AudioBook(100, 300, "The Jungle");                 // Line 2\nbooks[1] = new Book(400, "Captains Courageous");                  // Line 3\nSystem.out.println(books[0].pagesPerMinute());                   // Line 4\nSystem.out.println(books[0].toString());                         // Line 5\nSystem.out.println(books[0].length());                           // Line 6\nSystem.out.println(books[1].toString());                         // Line 7
question.csa2014-q22.answer=B
question.csa2014-q22.explanation=books[0] has declared type Book, which has no pagesPerMinute method. Runtime dispatch can select an override only after compile-time method lookup succeeds.
question.csa2014-q22.option.A=Line 2 will not compile because variables of type Book may not refer to variables of type AudioBook.
question.csa2014-q22.option.B=Line 4 will not compile because variables of type Book may only call methods in the Book class.
question.csa2014-q22.option.C=Line 5 will not compile because the AudioBook class does not have a method named toString declared or implemented.
question.csa2014-q22.option.D=Line 6 will not compile because the statement is ambiguous. The compiler cannot determine which length method should be called.
question.csa2014-q22.option.E=Line 7 will not compile because the element at index 1 in the array named books may not have been initialized.
