question.csa2015-q31.prompt=Which option represents board after this code segment executes? Each option lists rows 0 through 4 from top to bottom; columns run left to right.
question.csa2015-q31.code=String[][] board = new String[5][5];\nfor (int row = 0; row < 5; row++) {\n    for (int col = 0; col < 5; col++) { board[row][col] = "O"; }\n}\nfor (int val = 0; val < 5; val++) {\n    if (val % 2 == 1) {\n        int row = val;\n        int col = 0;\n        while (col < 5 && row >= 0) {\n            board[row][col] = "X";\n            col++;\n            row--;\n        }\n    }\n}
question.csa2015-q31.answer=E
question.csa2015-q31.explanation=Only val=1 and val=3 enter the while loop. Their writes lie on row+col=1 and row+col=3, stopping at row 0.
