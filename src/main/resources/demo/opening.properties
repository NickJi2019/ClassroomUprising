question.csa2014-q23.prompt=Assume animals is an ArrayList initialized to ["bear", "zebra", "bass", "cat", "koala", "baboon"]. What are its contents after manipulate() executes?
question.csa2014-q23.code=private List<String> animals;\npublic void manipulate() {\n    for (int k = animals.size() - 1; k > 0; k--) {\n        if (animals.get(k).substring(0, 1).equals("b")) {\n            animals.add(animals.size() - k, animals.remove(k));\n        }\n    }\n}
question.csa2014-q23.answer=B
question.csa2014-q23.explanation=The insertion index is evaluated before remove(k). baboon moves to index 1; bass is then encountered at shifted positions, and the final move restores the original list.
