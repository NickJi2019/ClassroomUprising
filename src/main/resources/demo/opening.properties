question.csa2015-q20.reason=Infer the loop invariant: suffix duplicate counts identify a mode index, not a maximum value.
question.csa2015-q20.prompt=Assume nums has been declared and initialized as an array of integer values. Which choice best describes the value returned by mystery(nums)?
question.csa2015-q20.code=/** Precondition: arr.length > 0 */\npublic static int mystery(int[] arr) {\n    int index = 0;\n    int count = 0;\n    int m = -1;\n    for (int outer = 0; outer < arr.length; outer++) {\n        count = 0;\n        for (int inner = outer + 1; inner < arr.length; inner++) {\n            if (arr[outer] == arr[inner]) { count++; }\n        }\n        if (count > m) {\n            index = outer;\n            m = count;\n        }\n    }\n    return index;\n}
question.csa2015-q20.answer=E
question.csa2015-q20.explanation=The first occurrence of a value sees all later copies. Maximizing that count finds a most-frequent value, and the method returns its index.
question.csa2015-q20.option.A=The maximum value that occurs in nums
question.csa2015-q20.option.B=An index of the maximum value that occurs in nums
question.csa2015-q20.option.C=The number of times that the maximum value occurs in nums
question.csa2015-q20.option.D=A value that occurs most often in nums
question.csa2015-q20.option.E=An index of a value that occurs most often in nums
