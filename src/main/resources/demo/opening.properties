question.csa2015-q26.reason=Distinguish local reference rebinding, primitive assignment and immutable String replacement.
question.csa2015-q26.prompt=Consider these two methods, which appear within a single class. What is printed as a result of the call start()?
question.csa2015-q26.code=public static void changeIt(int[] arr, int val, String word) {\n    arr = new int[5];\n    val = 0;\n    word = word.substring(0, 5);\n    for (int k = 0; k < arr.length; k++) { arr[k] = 0; }\n}\npublic static void start() {\n    int[] nums = {1, 2, 3, 4, 5};\n    int value = 6;\n    String name = "blackboard";\n    changeIt(nums, value, name);\n    for (int k = 0; k < nums.length; k++) { System.out.print(nums[k] + " "); }\n    System.out.print(value + " ");\n    System.out.print(name);\n}
question.csa2015-q26.answer=E
question.csa2015-q26.explanation=Java passes arguments by value. arr is rebound to a new array; nums still refers to the original array. Assigning val and word does not change value or name.
question.csa2015-q26.option.A=0 0 0 0 0 0 black
question.csa2015-q26.option.B=0 0 0 0 0 6 blackboard
question.csa2015-q26.option.C=1 2 3 4 5 6 black
question.csa2015-q26.option.D=1 2 3 4 5 0 black
question.csa2015-q26.option.E=1 2 3 4 5 6 blackboard
