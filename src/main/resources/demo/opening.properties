question.csa2015-q37.reason=Derive the exact worst-case iteration count for 2000 elements, including unsuccessful searches.
question.csa2015-q37.prompt=Suppose binarySearch is called with an array containing 2,000 elements sorted in increasing order. What is the maximum number of times the statement indicated by /* Calculate midpoint */ could execute?
question.csa2015-q37.code=/** Precondition: data is sorted in increasing order. */\npublic static int binarySearch(int[] data, int target) {\n    int start = 0;\n    int end = data.length - 1;\n    while (start <= end) {\n        int mid = (start + end) / 2; // Calculate midpoint\n        if (target < data[mid]) { end = mid - 1; }\n        else if (target > data[mid]) { start = mid + 1; }\n        else { return mid; }\n    }\n    return -1;\n}
question.csa2015-q37.answer=D
question.csa2015-q37.explanation=The largest remaining interval sizes are 2000, 1000, 500, 250, 125, 62, 31, 15, 7, 3, 1: eleven midpoint calculations.
question.csa2015-q37.option.A=2,000
question.csa2015-q37.option.B=1,000
question.csa2015-q37.option.C=20
question.csa2015-q37.option.D=11
question.csa2015-q37.option.E=1
